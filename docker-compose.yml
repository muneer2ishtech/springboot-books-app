services:
  ishtech-springboot-books-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_PORT: ${SERVER_PORT_REMOTE:-${SERVER_PORT:-8080}}
    image: muneer2ishtech/ishtech-springboot-books-app${APP_VERSION:+:$APP_VERSION}
    container_name: ishtech_springboot_books_app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://ishtech-springboot-books-postgres:5432/ishtech_dev_db
    ports:
      - "${SERVER_PORT_LOCAL:-${SERVER_PORT:-8080}}:${SERVER_PORT_REMOTE:-${SERVER_PORT:-8080}}"
    depends_on:
      ishtech-springboot-books-postgres:
        condition: service_healthy
    networks:
      - ishtech-springboot-books-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT_REMOTE:-${SERVER_PORT:-8080}}/actuator/health"]
      start_period: 60s

  ishtech-springboot-books-postgres:
    image: postgres:18
    container_name: ishtech_springboot_books_postgres
    environment:
      POSTGRES_DB: ishtech_dev_db
      POSTGRES_USER: ishtech_dev_user
      POSTGRES_PASSWORD: ishtech_dev_pass
    ports:
      - "${DB_PORT_LOCAL:-${DB_PORT:-5432}}:5432"
    volumes:
      - ishtech_springboot_books_postgres_data:/var/lib/postgresql/18/data
      - ./src/test/resources/db/postgres/init_db.sql:/docker-entrypoint-initdb.d/booksapp_dev_init_db.sql
    networks:
      - ishtech-springboot-books-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 45s

  ishtech-springboot-books-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ishtech_springboot_books_prometheus
    profiles: ["monitoring"]
    # Fills the scrape target into the config template, then starts Prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__SCRAPE_TARGET__|${PROMETHEUS_SCRAPE_TARGET:-ishtech-springboot-books-app:${SERVER_PORT_REMOTE:-${SERVER_PORT:-8080}}}|"
        /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT_LOCAL:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ishtech_springboot_books_prometheus_data:/prometheus
    networks:
      - ishtech-springboot-books-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      start_period: 15s

  ishtech-springboot-books-grafana:
    image: grafana/grafana:13.2.2
    container_name: ishtech_springboot_books_grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT_LOCAL:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ishtech_springboot_books_grafana_data:/var/lib/grafana
    depends_on:
      ishtech-springboot-books-prometheus:
        condition: service_healthy
    networks:
      - ishtech-springboot-books-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      start_period: 30s

volumes:
  ishtech_springboot_books_postgres_data:
  ishtech_springboot_books_prometheus_data:
  ishtech_springboot_books_grafana_data:

networks:
  ishtech-springboot-books-network:
    driver: bridge
